# Device Type
device_type: "DIGIT"
# Device Serial Number
device_serial: "D21242"
# Pixel Per Millimeter
ppmm: 18.633
# Desired Image Width and Height
imgh: 320
imgw: 240
# Raw image width, height, and framerate
raw_imgh: 320
raw_imgw: 240
framerate: 60
# Metric depth calibration
maximum_depth_mm: 2.2
# Force Estimation (Sparsh)
force:
  enable_force: false
  temporal_stride: 5
  encoder: sparsh-dino-base  # Required for decoder compatibility
  decoder: sparsh-digit-forcefield
  bg_offset: 0.5  # Background subtraction offset
  force_vector_scale: [2.0, 2.0, 2.0]  # Per-axis scale to convert normalized force_vector -> Newtons
