name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  cpu-safe-tests:
    name: cpu-safe-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run CPU-safe suite
        run: |
          set -euo pipefail
          pytest -q test \
            --ignore=test/test_depth_backends.py \
            --ignore=test/test_gpu_postprocess_equiv.py \
            --ignore=test/test_production_depth.py \
            --ignore=test/test_publisher_shm.py
